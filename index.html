<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrexham University - Incubation Hub Check-In</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        wrexham: { red: '#AD1F2D', redDark: '#871722', gray: '#1E293B', gold: '#D97706' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Mobile-First Check-In Card -->
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        
        <!-- Header: Hub Location & Privacy Notice -->
        <div class="bg-slate-900 text-white p-6 text-center relative">
            <div class="absolute top-4 left-4">
                <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-bold uppercase tracking-wider border border-emerald-500/30">
                    <i class="fa-solid fa-shield-halved mr-1"></i> GDPR Pseudonymous
                </span>
            </div>
            
            <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-3 mt-4 border border-white/20">
                <i class="fa-solid fa-wifi text-3xl text-emerald-400"></i>
            </div>
            
            <h1 class="text-xl font-bold" id="disp-hub-name">Incubation Shed A (Desk 3)</h1>
            <p class="text-xs text-slate-400 mt-1">NFC Tap Verified Session</p>

            <!-- Dynamic Tag Status Badge -->
            <div class="mt-4 bg-slate-800/90 rounded-xl p-3 border border-slate-700 flex justify-between items-center text-left">
                <div>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider" id="tag-mode-label">Security Mode (Demo)</p>
                    <p class="font-mono text-xs font-bold text-emerald-400 tracking-widest" id="disp-token-status">SIMULATED SUN TOKEN</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider">TTL Expiry</p>
                    <p class="font-mono text-xs font-bold text-amber-400" id="disp-timer">02:59</p>
                </div>
            </div>
        </div>

        <!-- Form Body -->
        <div class="p-6 space-y-4">
            <div id="form-alert" class="hidden p-3 rounded-xl text-xs font-medium flex items-center gap-2"></div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Pseudonymous Student ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">
                        <i class="fa-solid fa-id-badge"></i>
                    </span>
                    <input type="text" id="input-student-id" placeholder="e.g. W2004812" value="" class="w-full pl-9 pr-3 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-wrexham-red focus:border-transparent outline-none transition font-mono">
                </div>
                <p class="text-[10px] text-slate-400 mt-1">Real names remain safely isolated inside M365 SharePoint.</p>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Security PIN</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="input-pin" placeholder="Enter PIN" value="" maxlength="4" class="w-full pl-9 pr-3 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-wrexham-red focus:border-transparent outline-none transition">
                </div>
            </div>

            <button type="button" onclick="handleCheckIn()" class="w-full bg-wrexham-red hover:bg-wrexham-redDark text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-wrexham-red/30 transition duration-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-check"></i> Complete Attendance Check-In
            </button>
            
            <div class="text-center pt-2">
                <a href="#" onclick="switchMode()" class="text-[11px] text-slate-400 hover:underline">Toggle Hardware Mode (Demo / Real DNA)</a>
            </div>
        </div>
    </div>

    <!-- Application Script with Config Toggle -->
    <script>
        // ==========================================
        // CONFIGURATION SWITCH (Change to true when DNA tags arrive)
        // ==========================================
        const CONFIG = {
            USE_REAL_DNA_TAGS: false, // Set to 'true' when you deploy real NTAG 424 DNA tags
            POWER_AUTOMATE_URL: "https://333d8341f4afebe7a994c2628fceda.a8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/edab13c41e31439db16997a0c46ce675/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=zkguxT4tfITXqJV6Yeaip5PpzCeMkyqMBJe2JF0uq94"
        };
        
        // Global variable to hold current location read from NFC tag
        let currentShedLocation = "Default Incubation Hub";

        
        window.onload = function() {
            checkURLParameters();
            parseNfcUrlParameters();
            startTimer();
        };

        function parseNfcUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const shedParam = urlParams.get('shed');
        
            if (shedParam) {
                // Clean up formatting (e.g. "Shed_A" becomes "Shed A")
                currentShedLocation = shedParam.replace(/_/g, ' ');
                
                // Update UI display dynamically
                const hubTitleEl = document.getElementById('disp-hub-name');
                if (hubTitleEl) {
                    hubTitleEl.innerText = `Incubation Space: ${currentShedLocation}`;
                }
            } else {
                // Fallback if someone visits the page directly without scanning a tag
                currentShedLocation = "General Check-In Portal";
            }
        }

        // Reads incoming URL parameters when tapped
        function checkURLParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (CONFIG.USE_REAL_DNA_TAGS) {
                // REAL DNA MODE: Expects NTAG 424 encrypted payload parameters (?e=...&c=...)
                const encryptedPayload = urlParams.get('e');
                const macSignature = urlParams.get('c');

                document.getElementById('tag-mode-label').innerText = "Hardware Mode: NTAG 424 DNA";
                document.getElementById('disp-token-status').innerText = encryptedPayload ? "CRYPTOGRAPHICALLY VERIFIED" : "WAITING FOR PHYSICAL TAP";

                if (!encryptedPayload || !macSignature) {
                    showAlert("Warning: No hardware cryptographic signature detected. Please tap the physical tag.", "error");
                }
            } else {
                // DEMO SIMULATION MODE: Uses home static tag with fake dynamic simulation
                document.getElementById('tag-mode-label').innerText = "Security Mode: Demo Simulation";
                document.getElementById('disp-token-status').innerText = "SIMULATED SUN TOKEN ACTIVE";
            }
        }

        function startTimer() {
            let timeLeft = 180;
            setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                    let s = (timeLeft % 60).toString().padStart(2, '0');
                    document.getElementById('disp-timer').innerText = `${m}:${s}`;
                }
            }, 1000);
        }

        function handleCheckIn() {
            const studentId = document.getElementById('input-student-id').value.trim();
            const pin = document.getElementById('input-pin').value.trim();

            if (!studentId || !pin) {
                showAlert("Please enter your Student ID and PIN.", "error");
                return;
            }

            // Retrieve or create device binding token for this browser
            let deviceToken = localStorage.getItem('incubation_device_token');
            if (!deviceToken) {
                deviceToken = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('incubation_device_token', deviceToken);
            }

            const payload = {
                student_id: studentId,
                pin: pin,
                device_token: deviceToken,
                shed_location: currentShedLocation, // <--- Dynamic location from NFC tag
                tag_mode: CONFIG.USE_REAL_DNA_TAGS ? "NTAG_424_DNA" : "DEMO_SIMULATION",
                timestamp: new Date().toISOString()
            };

            // If Power Automate URL is configured, send data; otherwise demo success
            if (CONFIG.POWER_AUTOMATE_URL.includes("YOUR_POWER_AUTOMATE")) {
                showAlert(`[DEMO SUCCESS] Pseudonymous check-in logged for ${studentId} (GDPR Compliant).`, "success");
            } else {
                // Live fetch call to Power Automate webhook
                fetch(CONFIG.POWER_AUTOMATE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => {
                    if (res.ok) showAlert("Attendance successfully recorded to SharePoint.", "success");
                    else showAlert("Check-in rejected: Invalid PIN or unauthorized device.", "error");
                })
                .catch(() => showAlert("Network error connecting to backend.", "error"));
            }
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById('form-alert');
            alertBox.className = `p-3 rounded-xl text-xs font-medium flex items-center gap-2 ${type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}`;
            alertBox.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-500' : 'fa-circle-exclamation text-red-500'}"></i> ${msg}`;
            alertBox.classList.remove('hidden');
        }

        function switchMode() {
            CONFIG.USE_REAL_DNA_TAGS = !CONFIG.USE_REAL_DNA_TAGS;
            checkURLParameters();
            alert("Switched mode to: " + (CONFIG.USE_REAL_DNA_TAGS ? "Real NTAG 424 DNA" : "Demo Simulation"));
        }
    </script>
</body>
</html>
